# =============================================================================
#  VMock Clone - scoring rule configuration
# =============================================================================
#  Every number the engine uses lives here. Nothing is learned, nothing is
#  generated by a language model: the score is a deterministic function of
#  these weights and the lexicons in vmock_clone/lexicons.py.
#
#  This mirrors how the real VMock works. Its patent (US11120403B2, "Career
#  Analytics Platform") publishes the actual formulas -- weighted sums over
#  hand-built feature detectors, e.g.
#     Presentation = wp * (w1*a1*rm + w2*a2*rs + w3*a3*rms + w4*a4*rf + w5*a5*rse)
#  ...where the terms are margins, section layout, section count, formatting
#  consistency and spelling errors. Same idea below.
# =============================================================================

meta:
  # Red / Yellow / Green cutoffs. These match VMock's published zones.
  zones:
    red:    [0, 32]
    yellow: [33, 85]
    green:  [86, 100]
  # Minimum words before the engine will return a score at all.
  # VMock's own SMART Editor guide: "You must have at least 200 words."
  min_words_for_score: 200

# -----------------------------------------------------------------------------
#  QUIRKS
# -----------------------------------------------------------------------------
#  Rules that real VMock demonstrably applies but that are bad resume advice,
#  arbitrary, or outright buggy. Documented in university guides and student
#  press. Turn the whole block off with strict_vmock_quirks: false, or disable
#  them one at a time.
# -----------------------------------------------------------------------------
quirks:
  strict_vmock_quirks: true

  # BU College of Engineering documents a *15 point* deduction for writing a
  # phone number as (617) 555-0123 instead of 617-555-0123.
  # DEFAULT OFF: contradicted by direct evidence. A resume carrying
  # "(555) 010-0199" scored 30/30 on Presentation against CMU's benchmark.
  # Either the rule is benchmark-specific or the published figure is wrong.
  phone_parens_penalty:
    enabled: false
    points: 15

  # BU: "'Leadership & Activities' is allowed while 'Leadership and Activities'
  # is not." Ampersand-only heading allowlist.
  heading_ampersand_strict:
    enabled: true
    points: 3

  # Articles and pronouns counted as filler words. Defensible for "I/we/my",
  # much less so for "a/the/that", which VMock counts anyway.
  # DEFAULT OFF: a resume using "a"/"the" freely was marked green on
  # Avoided Words, so VMock does not appear to count articles.
  articles_are_filler:
    enabled: false

  # "Sept" rejected; only "Sep" accepted, no trailing period.
  # DEFAULT OFF: a resume using "Sept. 2022" and "Aug. 2026" throughout still
  # scored 30/30 on Presentation.
  strict_month_abbreviations:
    enabled: false

  # VMock requires a space-hyphen-space date range: "Jun - Aug 2017".
  # "June-August 2017" and "Jun -Aug 2017" are both flagged.
  strict_date_range_spacing:
    enabled: true

  # VMock's SMART Editor requires the email address in all lowercase.
  email_lowercase:
    enabled: true

  # Flags any word missing from the dictionary, including correctly spelled
  # product and library names (the single most common student complaint).
  # Turn off to skip tokens that look like proper nouns or tech identifiers.
  # DEFAULT OFF: "WebSocket", "JSONL", "ASR" and similar were not flagged on a
  # real run, and false positives here are the most-complained-about behaviour.
  aggressive_spellcheck:
    enabled: false

# -----------------------------------------------------------------------------
#  MODULE WEIGHTS - must sum to 100
# -----------------------------------------------------------------------------
modules:
  impact:        40
  presentation:  30
  competencies:  30

# -----------------------------------------------------------------------------
#  PRESENTATION  /30
# -----------------------------------------------------------------------------
#  Sub-parameter names follow VMock's own UI labels. "Overall Format" carries
#  most of the weight: a student at 12/30 was told that fixing overall format
#  alone would return "17 of the possible 18 remaining points".
# -----------------------------------------------------------------------------
presentation:
  overall_format: 17
  # NOT OBSERVED: VMock never displays per-check point values, only pass/fail
  # chips and the module total. This cost-per-failed-check is fitted to the one
  # ground truth we have (Presentation 12/30 with 4 of 11 checks failing).
  points_per_failed_format_check: 3.1
  # Same caveat: per-check values are never displayed by VMock.
  points_per_failed_detail_check: 1.5
  # OBSERVED: a resume with 3 red (lowercase) misspellings scored "Needs Work!"
  # on Spell Check; one with only yellow (capitalised) unknowns lost nothing.
  points_per_misspelling: 1.0
  # OBSERVED, and benchmark-specific:
  #   "CMU Resumes"             -> "No italics, not abbreviated"
  #   "CMU Masters - Technical" -> "Consistent Styling, not abbreviated"
  degree_styling_rule: "No italics, not abbreviated"
  overall_format_breakdown:
    date_formatting:       6
    section_spacing:       4
    bullet_consistency:    4
    font_and_alignment:    3
  number_of_pages:         4
  essential_sections:      4
  section_specific:        3   # contact block: name, phone, email, location, linkedin
  spell_check:             2

  geometry:
    page_limit: 1              # 2 for health / research / education benchmarks
    page_limit_grace: 0.15     # a page <=15% full past the limit is only half-penalised
    margin_min_in: 0.35        # a 0.4" resume scored 30/30; 0.5 was too strict
    margin_max_in: 1.0
    body_font_min_pt: 9.5
    body_font_max_pt: 12.0
    max_distinct_body_font_sizes: 2
    date_right_align_tolerance_in: 0.35
    max_bullet_glyph_variants: 1
    # CMU's VMock template: "either all bullet points should end with a
    # period/full-stop or none of them". Observed in a real Bullet Check failure.
    bullet_punctuation_consistency: true
    max_indent_variants: 3
    blank_line_before_section: true

  spell:
    # The bundled dictionary is en_US. Real VMock flags "honours" and
    # "organisation"; set this false to reproduce that.
    commonwealth_ok: true

  contact:
    require: [email, phone]
    optional: [linkedin, location, github, website]
    email_must_be_lowercase: true      # VMock SMART Editor guide
    max_lines: 3

# -----------------------------------------------------------------------------
#  IMPACT  /40
# -----------------------------------------------------------------------------
impact:
  # OBSERVED sub-parameter set (CMU Masters - Technical benchmark, 2026-08-26):
  #   Action Oriented | Specifics | Overuse | Avoided Words
  # "Bullet Length & Density" and "Career Progression" were invented by this
  # project and are gone -- VMock has no such sub-parameters.
  action_oriented:      12
  specifics:            12
  overuse:               8
  avoided_words:         8

  # Extra-curriculars was observed on the "CMU Resumes" benchmark but is ABSENT
  # on "CMU Masters - Technical". Its rule text has never been read, so it stays
  # off; turning it on without the rule would be guessing.
  extracurriculars:
    enabled: false
    points: 0

  bullets:
    # Calibrated against real VMock output, which told a resume whose bullets
    # ran 35-50 words that some bullets were "too short" - its tolerated band
    # is much wider than the one career-centre guides suggest.
    min_words: 8
    ideal_min_words: 12
    ideal_max_words: 55
    max_words: 80
    # Sections whose lines are lists, not accomplishment statements. Scoring
    # "Languages: Python, R, SQL" for its opening action verb is meaningless.
    skip_sections: [skills, coursework, interests, languages, certifications, summary]
    max_bullets_per_entry: 4         # BU: trim entries with more than four
    min_bullets_per_entry: 2

  verb_weights:
    # OBSERVED: a resume whose bullets open with ordinary verbs (Implemented,
    # Modeled, Applied, Designed, Delivered...) was rated "Good Job!" on Action
    # Oriented. A standard verb therefore cannot be worth only 0.65.
    strong: 1.0
    standard: 0.92
    weak: 0.35
    none: 0.0                         # noun-phrase or "Responsible for" openers

  specifics_rules:
    # Share of bullets that should carry a number. Real VMock rated a resume at
    # 10/15 quantified bullets as merely "On Track", so full credit has to sit
    # above that band, not below it.
    quantified_bullet_target: 0.55
    tools_named_target: 0.20          # share that should name a tool/method/skill
    passive_voice_penalty_per_bullet: 0.5

  overuse_rules:
    # OBSERVED (CMU Masters - Technical, 2026-08-26): VMock flagged
    # "Analyzed 3" and "Provided/Providing 3". So the threshold fires AT 3
    # occurrences, and inflected forms are counted together as one item.
    flag_at_occurrences: 3
    lemma_grouped: true
    # OBSERVED: VMock flagged "Analyzed" and "Provided/Providing" -- both from
    # experience bullets -- while "Physics" and "Analysis", which appear far more
    # often inside the Relevant Coursework list, were NOT flagged. So list-style
    # sections are excluded from the overuse count.
    verbs_only: true
    # OBSERVED: "Engineered" x3 was NOT flagged while "Developed" x3 was.
    exclude_distinctive_verbs: true
    # OBSERVED: "model/models" x7 was NOT flagged -- it never appears in a
    # verb form, so it is a noun in this resume.
    require_verb_form: true
    # Both observed reports displayed exactly two chips.
    max_reported: 2
    # OBSERVED: Masters_1's degree is "Applied Data Science" and VMock never
    # flagged "Applied"; Education is excluded along with the list sections.
    skip_sections: [education, coursework, skills, interests, languages, certifications]
  avoided_words_rules:
    # OBSERVED: VMock reports two separate lists under Avoided Words --
    #   "words which are usually considered as filler words"  -> That 1, Have 1, The 5
    #   "personal pronouns which should be avoided"           -> I 7, My 4, I am 3, ...
    # Every flagged occurrence sat inside the Personal Statement prose block,
    # so VMock scans the summary section. This clone used to skip it entirely.
    scan_all_sections: true
    filler_weight: 0.5
    pronoun_weight: 0.5
    # Articles ARE counted: "The 5" and "That 1" were flagged directly.
    include_articles: true

# -----------------------------------------------------------------------------
#  COMPETENCIES  /30
# -----------------------------------------------------------------------------
#  Five NACE-aligned competencies, 6 points each. VMock scans ALL content --
#  bullets, position titles, degree program, coursework, skills, languages --
#  not just the experience bullets.
#
#  Full marks require evidence spread across a competency's distinct facets,
#  so repeating "led" ten times will not max out Leadership.
# -----------------------------------------------------------------------------
competencies:
  # OBSERVED band values, derived from two reports:
  #   Yuxuan   30/30 = 5 x "Good Job!"                  -> Good Job = 6.0
  #   Masters_1 23/30 = 3 x "Good Job!" + 2 x "On Track!" -> On Track = 2.5
  points_good_job:   6.0
  points_on_track:   2.5
  points_needs_work: 0.0
  # How many bullets must exhibit the competency to reach "Good Job!".
  # Calibrated: Masters_1's Teamwork showed 4 highlighted bullets and was
  # still only "On Track!", so the bar is above 4.
  bullets_for_good_job: 5
  list: [analytical, communication, leadership, teamwork, initiative]

# -----------------------------------------------------------------------------
#  BENCHMARK PROFILES
# -----------------------------------------------------------------------------
#  VMock is benchmark-parameterised: the SAME resume produces a different check
#  set depending on which cohort it is scored against. Directly observed:
#
#    "CMU Masters - Technical Resumes"  -> 11 Overall Format checks
#                                          4 Impact sub-parameters
#    "CMU Resumes"                      ->  9 Overall Format checks
#                                          5 Impact sub-parameters
#                                            (it has Extra-curriculars)
#
#  WHICH two checks are dropped in the 9-check variant was never observed, so
#  that profile is marked incomplete rather than guessed at.
# -----------------------------------------------------------------------------
benchmark_profiles:
  default: cmu_masters_technical

  cmu_masters_technical:
    label: "CMU Masters - Technical Resumes"
    observed: complete
    format_checks:
      - bullet_alignment
      - bullet_check
      - bullet_count
      - date_formatting
      - font_size_check
      - references
      - page_margins
      - objective_summary_length
      - section_styling
      - photo_check
      - section_spacing
    impact_subparameters: [action_oriented, specifics, overuse, avoided_words]

  cmu_resumes:
    label: "CMU Resumes"
    observed: partial
    # Only the count (9) and one member (Bullet Check, seen failing) are known.
    # format_checks is deliberately left unset: naming 9 of the 11 would be a
    # guess, and this project does not guess.
    # Only 3 of the 9 are known by name, all seen failing on the 69 resume:
    #   Bullet Check | Date Formatting | Font Size Check
    # The remaining 6 were never expanded, so they are not named here.
    format_checks: null
    expected_format_check_count: 9
    known_format_checks: [bullet_check, date_formatting, font_size_check]
    degree_styling_rule: "No italics, not abbreviated"
    impact_subparameters:
      [action_oriented, specifics, overuse, avoided_words, extracurriculars]

# -----------------------------------------------------------------------------
#  BENCHMARK
# -----------------------------------------------------------------------------
#  VMock plots you on a bell curve built from resumes your institution uploaded.
#  Build your own with:  python3 -m vmock_clone benchmark ./folder_of_pdfs
# -----------------------------------------------------------------------------
benchmark:
  default: general
  general:
    # OBSERVED, stated by VMock itself: "Historical resumes from CMU are observed
    # to secure, on average, a score of 70 on the VMock platform."
    label: "CMU cohort (mean stated by VMock)"
    n: 0
    mean: 70.0
    stdev: 14.0
