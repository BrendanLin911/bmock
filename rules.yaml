# =============================================================================
#  VMock Clone - scoring rule configuration
# =============================================================================
#  Every number the engine uses lives here. Nothing is learned, nothing is
#  generated by a language model: the score is a deterministic function of
#  these weights and the lexicons in vmock_clone/lexicons.py.
#
#  This mirrors how the real VMock works. Its patent (US11120403B2, "Career
#  Analytics Platform") publishes the actual formulas -- weighted sums over
#  hand-built feature detectors, e.g.
#     Presentation = wp * (w1*a1*rm + w2*a2*rs + w3*a3*rms + w4*a4*rf + w5*a5*rse)
#  ...where the terms are margins, section layout, section count, formatting
#  consistency and spelling errors. Same idea below.
# =============================================================================

meta:
  # Red / Yellow / Green cutoffs. These match VMock's published zones.
  zones:
    red:    [0, 32]
    yellow: [33, 85]
    green:  [86, 100]
  # Minimum words before the engine will return a score at all.
  # VMock's own SMART Editor guide: "You must have at least 200 words."
  min_words_for_score: 200

#  MODULE WEIGHTS - must sum to 100
# -----------------------------------------------------------------------------
modules:
  impact:        40
  presentation:  30
  competencies:  30

# -----------------------------------------------------------------------------
#  PRESENTATION  /30
# -----------------------------------------------------------------------------
#  Sub-parameter names follow VMock's own UI labels. "Overall Format" carries
#  most of the weight: a student at 12/30 was told that fixing overall format
#  alone would return "17 of the possible 18 remaining points".
# -----------------------------------------------------------------------------
presentation:
  # DERIVED, and an exact unique fit across five real reports spanning two
  # benchmarks: each Presentation sub-parameter is ALL-OR-NOTHING. Any failing
  # check inside it zeroes the whole sub-parameter; otherwise it scores full.
  #
  # The decisive evidence: two resumes that are byte-identical except that one
  # has 14/19 bullets ending in a period and the other 19/19 scored 14/30 and
  # 30/30. A single failed check is worth 16 points.
  #
  # Solving the five observations for integer weights summing to 30 yields
  # exactly one solution:
  all_or_nothing: true
  # ...but only for the sub-parameters VMock renders as a pass/fail check list.
  # Essential Sections and Spell Check accumulate point deductions instead:
  #   Ziqi   0 + 1 + 9 + 0 + (3-2 misspellings) = 11  (VMock 11)
  #   M1     0 + 0 + 9 + 0 +  3                 = 12  (VMock 12)
  #   Yuxuan 16 + 1 + (9-1 unmapped heading) + 1 + 3  = 29  (VMock 29)
  # That is the only assignment that hits all three known totals at once.
  graded_subs: [essential_sections, spell_check]
  # OBSERVED (Yuxuan, 29/30 with every check green): the one thing wrong with
  # that resume is the merged heading "RESEARCH & PROJECTS", which maps to no
  # standard section.
  points_per_unknown_section: 1.0
  max_unknown_section_loss: 2.0   # an alias gap must never gut the sub-parameter
  overall_format: 16
  # NOT OBSERVED: VMock never displays per-check point values, only pass/fail
  # chips and the module total. This cost-per-failed-check is fitted to the one
  # ground truth we have (Presentation 12/30 with 4 of 11 checks failing).
  points_per_failed_format_check: 3.1
  # Same caveat: per-check values are never displayed by VMock.
  points_per_failed_detail_check: 1.5
  # OBSERVED: a resume with 3 red (lowercase) misspellings scored "Needs Work!"
  # on Spell Check; one with only yellow (capitalised) unknowns lost nothing.
  points_per_misspelling: 1.0
  # OBSERVED, and benchmark-specific:
  #   "CMU Resumes"             -> "No italics, not abbreviated"
  #   "CMU Masters - Technical" -> "Consistent Styling, not abbreviated"
  degree_styling_rule: "No italics, not abbreviated"
  overall_format_breakdown:
    date_formatting:       6
    section_spacing:       4
    bullet_consistency:    4
    font_and_alignment:    3
  number_of_pages:         1
  essential_sections:      9
  section_specific:        1   # contact block: name, phone, email, location, linkedin
  spell_check:             3

  geometry:
    page_limit: 1              # 2 for health / research / education benchmarks
    page_limit_grace: 0.15     # a page <=15% full past the limit is only half-penalised
    margin_min_in: 0.35        # a 0.4" resume scored 30/30; 0.5 was too strict
    margin_max_in: 1.0
    body_font_min_pt: 9.5
    body_font_max_pt: 12.0
    # OBSERVED: a resume with 9pt and 10pt body text FAILED Font Size Check,
    # while three resumes with a single body size all passed it.
    max_distinct_body_font_sizes: 1
    date_right_align_tolerance_in: 0.35
    max_bullet_glyph_variants: 1
    # CMU's VMock template: "either all bullet points should end with a
    # period/full-stop or none of them". Observed in a real Bullet Check failure.
    bullet_punctuation_consistency: true
    max_indent_variants: 3
    blank_line_before_section: true

  spell:
    # The bundled dictionary is en_US. Real VMock flags "honours" and
    # "organisation"; set this false to reproduce that.
    commonwealth_ok: true

  contact:
    require: [email, phone]
    optional: [linkedin, location, github, website]
    email_must_be_lowercase: true      # VMock SMART Editor guide
    max_lines: 3

# -----------------------------------------------------------------------------
#  IMPACT  /40
# -----------------------------------------------------------------------------
impact:
  # OBSERVED sub-parameter set (CMU Masters - Technical benchmark, 2026-08-26):
  #   Action Oriented | Specifics | Overuse | Avoided Words
  # "Bullet Length & Density" and "Career Progression" were invented by this
  # project and are gone -- VMock has no such sub-parameters.
  action_oriented:      12
  specifics:            12
  overuse:               8
  avoided_words:         8

  # Extra-curriculars is OBSERVED on the "CMU Resumes" benchmark and ABSENT on
  # "CMU Masters - Technical". Its panel text has never been read, but its
  # WEIGHT is now pinned by arithmetic: Brendan's 77 and 93 resumes are clean on
  # all four shared sub-parameters and still score Impact 34/40, and the only
  # sub-parameter they cannot satisfy is this one. 40 - 34 = 6.
  #
  # Declared weights sum to 46 on this profile; Impact is 40, so the engine
  # rescales by 40/46. That reproduces 34/40 exactly for a resume that is
  # perfect on the other four and has no extra-curricular section.
  extracurriculars:
    enabled: true
    points: 6

  bullets:
    # Calibrated against real VMock output, which told a resume whose bullets
    # ran 35-50 words that some bullets were "too short" - its tolerated band
    # is much wider than the one career-centre guides suggest.
    min_words: 8
    ideal_min_words: 12
    ideal_max_words: 55
    max_words: 80
    # Sections whose lines are lists, not accomplishment statements. Scoring
    # "Languages: Python, R, SQL" for its opening action verb is meaningless.
    skip_sections: [skills, coursework, interests, languages, certifications, summary]
    max_bullets_per_entry: 4         # BU: trim entries with more than four
    min_bullets_per_entry: 2

  verb_weights:
    # OBSERVED: a resume whose bullets open with ordinary verbs (Implemented,
    # Modeled, Applied, Designed, Delivered...) was rated "Good Job!" on Action
    # Oriented. A standard verb therefore cannot be worth only 0.65.
    strong: 1.0
    standard: 0.92
    weak: 0.35
    none: 0.0                         # noun-phrase or "Responsible for" openers

  specifics_rules:
    # Share of bullets that should carry a number. Real VMock rated a resume at
    # 10/15 quantified bullets as merely "On Track", so full credit has to sit
    # above that band, not below it.
    quantified_bullet_target: 0.60
    tools_named_target: 0.15          # share that should name a tool/method/skill
    # Split between the two signals. VMock's Specifics panel names BOTH -- it
    # asks for "more quantification of the impact and scope of your work" and
    # green-highlights named things (ERP, Distinction, 3.22/4.0, I-III) -- and
    # an even split is what reproduces the observed module totals.
    quantification_weight: 0.5
    passive_voice_penalty_per_bullet: 0.5

  overuse_rules:
    # OBSERVED (CMU Masters - Technical, 2026-08-26): VMock flagged
    # "Analyzed 3" and "Provided/Providing 3". So the threshold fires AT 3
    # occurrences, and inflected forms are counted together as one item.
    flag_at_occurrences: 3
    # OBSERVED flagged vocabulary. Every word VMock has been seen to flag, and
    # nothing else. Words that cleared the 3-occurrence threshold on the same
    # two reports and were NOT flagged: Applied (4), Lead/Leading (3),
    # Engineered (3), benchmarking/benchmarks (3), model (7). VMock's own
    # Community Insights panel names DEVELOPED and ANALYSED as the community's
    # most frequently used action verbs, which is what this list is.
    common_verbs_only: true
    # OBSERVED (Ziqi, CMU Resumes, 2026-08-26): VMock flagged "Built 3"
    # alongside "Support/Supported 4", which adds `build` to this list.
    #
    # CAVEAT: this is an allow-list of verbs VMock has actually been SEEN to
    # flag, so Overuse can only ever fire on these five. That is an artefact of
    # having three reports, not a model -- every new report is likely to add to
    # it. If a resume repeats some other verb and we stay silent, this is why.
    common_verbs: [analyze, analyse, provide, develop, support, build]
    lemma_grouped: true
    # OBSERVED: VMock flagged "Analyzed" and "Provided/Providing" -- both from
    # experience bullets -- while "Physics" and "Analysis", which appear far more
    # often inside the Relevant Coursework list, were NOT flagged. So list-style
    # sections are excluded from the overuse count.
    verbs_only: true
    # OBSERVED: "Engineered" x3 was NOT flagged while "Developed" x3 was.
    exclude_distinctive_verbs: true
    # OBSERVED: "model/models" x7 was NOT flagged -- it never appears in a
    # verb form, so it is a noun in this resume.
    require_verb_form: true
    # Both observed reports displayed exactly two chips.
    max_reported: 2
    # Groups at which the sub-parameter is fully lost. Two flagged groups rated
    # "On Track!" on both observed reports, which puts two groups above the
    # 42% mark; 6 does that and reproduces both module totals.
    full_loss_at_groups: 6.0
    # OBSERVED: Masters_1's degree is "Applied Data Science" and VMock never
    # flagged "Applied"; Education is excluded along with the list sections.
    skip_sections: [education, coursework, skills, interests, languages, certifications]
  avoided_words_rules:
    # OBSERVED: VMock reports two separate lists under Avoided Words --
    #   "words which are usually considered as filler words"  -> That 1, Have 1, The 5
    #   "personal pronouns which should be avoided"           -> I 7, My 4, I am 3, ...
    # Every flagged occurrence sat inside the Personal Statement prose block,
    # so VMock scans the summary section. This clone used to skip it entirely.
    scan_all_sections: true
    filler_weight: 0.6
    pronoun_weight: 0.4
    # Counts, not densities -- VMock reports counts and the two resumes that
    # pin this scale differ far more in count than in rate.
    filler_full_at: 16
    pronoun_full_at: 8
    # Articles ARE counted: "The 5" and "That 1" were flagged directly.
    include_articles: true

# -----------------------------------------------------------------------------
#  COMPETENCIES  /30
# -----------------------------------------------------------------------------
#  Five NACE-aligned competencies, 6 points each. VMock scans ALL content --
#  bullets, position titles, degree program, coursework, skills, languages --
#  not just the experience bullets.
#
#  Full marks require evidence spread across a competency's distinct facets,
#  so repeating "led" ten times will not max out Leadership.
# -----------------------------------------------------------------------------
competencies:
  # OBSERVED band values, derived from two reports:
  #   Yuxuan   30/30 = 5 x "Good Job!"                  -> Good Job = 6.0
  #   Masters_1 23/30 = 3 x "Good Job!" + 2 x "On Track!" -> On Track = 2.5
  points_each: 6.0
  # Continuous within a competency, quantised to this step.
  rounding_step: 0.5
  # Chip thresholds for display only -- they do not affect the score.
  chip_good_job_at: 5.0
  chip_on_track_at: 2.5
  # Units of evidence needed for full credit.
  #
  # OBSERVED anchor: Masters_1 scored Competencies 23/30 with three "Good Job!"
  # chips and two "On Track!" ones whose tooltips read "4 bullets highlighted"
  # and "1 bullet highlighted". Three full 6.0s plus 4 and 1 is exactly 23, so
  # points rise one-for-one with highlighted units up to 6. Against VMock's own
  # counts the ramp reaches full credit at 6 units.
  #
  # This clone's detector is a lexicon, not VMock's ~10,000-skill database, and
  # it recovers fewer units per resume than VMock does. 5 is the ramp length
  # that makes OUR unit counts reproduce VMock's published module scores
  # (23/30 on Masters_1 exactly, 29/30 on two of Brendan's, 29 vs 30 on
  # Yuxuan's). It is a calibration of this detector, not a claim about VMock's.
  distinct_evidence: true
  units_for_full_credit: 5
  # OBSERVED: the Teamwork bullets VMock highlighted on Masters_1 were the four
  # WORK bullets, not the paraphrases of them inside the Personal Statement, so
  # a summary block does not add units of its own.
  skip_sections: [summary]
  list: [analytical, communication, leadership, teamwork, initiative]

# -----------------------------------------------------------------------------
#  BENCHMARK PROFILES
# -----------------------------------------------------------------------------
#  VMock is benchmark-parameterised: the SAME resume produces a different check
#  set depending on which cohort it is scored against. Directly observed:
#
#    "CMU Masters - Technical Resumes"  -> 11 Overall Format checks
#                                          4 Impact sub-parameters
#    "CMU Resumes"                      ->  9 Overall Format checks
#                                          5 Impact sub-parameters
#                                            (it has Extra-curriculars)
#
#  The 9-check list was later read in full off the 77 report, so the two checks
#  the smaller benchmark drops are known by subtraction: Bullet Count and
#  Objective/Summary Length.
# -----------------------------------------------------------------------------
benchmark_profiles:
  default: cmu_resumes

  cmu_masters_technical:
    label: "CMU Masters - Technical Resumes"
    observed: complete
    format_checks:
      - bullet_alignment
      - bullet_check
      - bullet_count
      - date_formatting
      - font_size_check
      - references
      - page_margins
      - objective_summary_length
      - section_styling
      - image_check
      - section_spacing
    # OBSERVED rule text on this benchmark. The CMU Resumes wording is
    # different ("No italics, not abbreviated"), and Masters_1 -- whose degree
    # lines are italicised -- passed this check.
    degree_styling_rule: "Consistent Styling, not abbreviated"
    impact_subparameters: [action_oriented, specifics, overuse, avoided_words]

  cmu_resumes:
    label: "CMU Resumes"
    observed: complete
    # All 9 members read off the real UI (77 report): Bullet Check failing,
    # the other 8 listed as passing. The list being complete settles what the
    # 9-check benchmark drops relative to the 11-check one -- Bullet Count and
    # Objective/Summary Length -- by subtraction, not by guessing.
    #
    # This REPLACES an earlier inference (now refuted) that Bullet Alignment
    # was one of the two dropped checks. It is present here.
    format_checks:
      - bullet_alignment
      - bullet_check
      - date_formatting
      - font_size_check
      - references
      - page_margins
      - section_styling
      - image_check
      - section_spacing
    expected_format_check_count: 9
    degree_styling_rule: "No italics, not abbreviated"
    impact_subparameters:
      [action_oriented, specifics, overuse, avoided_words, extracurriculars]

# -----------------------------------------------------------------------------
#  BENCHMARK
# -----------------------------------------------------------------------------
#  VMock plots you on a bell curve built from resumes your institution uploaded.
#  Build your own with:  python3 -m vmock_clone benchmark ./folder_of_pdfs
# -----------------------------------------------------------------------------
benchmark:
  default: general
  general:
    # OBSERVED, stated by VMock itself: "Historical resumes from CMU are observed
    # to secure, on average, a score of 70 on the VMock platform."
    label: "CMU cohort (mean stated by VMock)"
    n: 0
    mean: 70.0
    stdev: 14.0
